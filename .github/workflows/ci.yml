name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  python:
    # The runner is Windows-only, so lint and test it on Windows.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - name: pytest
        # Exit code 5 means "no tests collected". Allowed until the first test exists.
        run: uv run pytest || [ $? -eq 5 ]

  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "26.2"
            fabric_api: "0.161.0+26.2"
          - minecraft: "26.3"
            fabric_api: "0.161.0+26.3"
    name: probe (${{ matrix.minecraft }})
    defaults:
      run:
        working-directory: probe
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: microsoft
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build -Pminecraft_version=${{ matrix.minecraft }} -Pfabric_api_version=${{ matrix.fabric_api }}
