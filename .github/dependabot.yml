version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /probe
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      probe:
        patterns: ["*"]
