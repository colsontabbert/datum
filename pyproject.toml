[project]
name = "datum"
version = "0.1.0"
description = "Benchmarks and tunes Minecraft Java Edition settings, mods, and packs, with honest statistics."
authors = [
    { name = "Colson Tabbert" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
datum = "datum:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
